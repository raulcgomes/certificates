<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raul Gomes - Professional Certificates" />
    <title>Raul Gomes | Certificates</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="container">
      <div class="eyebrow">Certifications & Professional Development</div>
      <h1>Certificates</h1>
      <p class="intro">
        A collection of professional certifications, courses, conferences, hackathons, expos and learning achievements.
      </p>
    </header>

    <main class="container">
      <div class="section-title">
        <h2>My Certificates</h2>
        <span class="count" id="count"></span>
      </div>
      <section class="grid" id="certificates"></section>
    </main>

    <footer>
      <div class="container">Raul Gomes · Professional Certificates</div>
    </footer>

    <dialog class="certificate-modal" id="certificate-modal" aria-label="Certificate preview">
      <button class="certificate-modal__close" type="button" aria-label="Close certificate">&times;</button>
      <img class="certificate-modal__image" id="certificate-modal-image" alt="">
      <p class="certificate-modal__title" id="certificate-modal-title"></p>
    </dialog>

    <script>
      async function loadCertificates() {
        const response = await fetch("certificates.json");
        const certificates = await response.json();

        document.getElementById("count").textContent =
          `${certificates.length} certificate${certificates.length === 1 ? "" : "s"}`;

        const grid = document.getElementById("certificates");

        certificates
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .forEach((cert) => {
          const card = document.createElement("article");
          card.className = "card";

          card.innerHTML = `
          <button class="preview view-certificate" type="button" data-image="${cert.image}" data-title="${cert.title}" aria-label="View ${cert.title} certificate">
            <img src="${cert.image}" alt="${cert.title} certificate">
          </button>
          <div class="content">
            <div class="type">${cert.type}</div>
            <h3>${cert.title}</h3>
            <p class="subtitle">${cert.subtitle}</p>
            <div class="meta">
              <span>${cert.issuer}</span>
              <span>${cert.date} · ${cert.duration}</span>
              <span>${cert.location}</span>
            </div>
            <button class="button view-certificate" type="button" data-image="${cert.image}" data-title="${cert.title}">
              View Certificate →
            </button>
        </div>
      `;

          grid.appendChild(card);
        });

        const modal = document.getElementById("certificate-modal");
        const modalImage = document.getElementById("certificate-modal-image");
        const modalTitle = document.getElementById("certificate-modal-title");

        grid.addEventListener("click", (event) => {
          const button = event.target.closest(".view-certificate");
          if (!button) return;

          modalImage.src = button.dataset.image;
          modalImage.alt = `${button.dataset.title} certificate`;
          modalTitle.textContent = button.dataset.title;
          modal.showModal();
        });

        modal.querySelector(".certificate-modal__close").addEventListener("click", () => {
          modal.close();
        });

        modal.addEventListener("click", (event) => {
          if (event.target === modal) modal.close();
        });

        modal.addEventListener("close", () => {
          modalImage.removeAttribute("src");
        });
      }

      loadCertificates().catch((error) => {
        document.getElementById("certificates").innerHTML =
          "<p>Unable to load certificates.</p>";
        console.error(error);
      });
    </script>
  </body>
</html>

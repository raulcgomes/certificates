<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Raul Gomes - Professional Certificates" />
    <title>Raul Gomes | Certificates</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="container">
      <div class="eyebrow">Certifications & Professional Development</div>
      <h1>Certificates</h1>
      <p class="intro">
        A collection of professional certifications, courses, conferences, hackathons, expos and learning achievements.
      </p>
    </header>

    <main class="container">
      <div class="section-title">
        <h2>My Certificates</h2>
        <span class="count" id="count"></span>
      </div>
      <section class="grid" id="certificates"></section>
    </main>

    <footer>
      <div class="container">Raul Gomes · Professional Certificates</div>
    </footer>

    <dialog class="certificate-modal" id="certificate-modal" aria-label="Certificate preview">
      <button class="certificate-modal__close" type="button" aria-label="Close certificate">&times;</button>
      <img class="certificate-modal__image" id="certificate-modal-image" alt="">
      <p class="certificate-modal__title" id="certificate-modal-title"></p>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Raul Gomes - Professional Certificates">
  <title>Raul Gomes | Certificates</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #fff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #d9a900;
      --accent-dark: #9b7600;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }
    header { padding: 72px 0 48px; }
    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent-dark);
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(40px, 7vw, 68px);
      line-height: .98;
      letter-spacing: -.04em;
    }
    .intro {
      max-width: 680px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
    }
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 18px 0 24px;
    }
    .section-title h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -.02em;
    }
    .count { color: var(--muted); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      padding-bottom: 70px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 35px rgba(17,24,39,.08);
    }
    .preview {
      display: block;
      aspect-ratio: 1.414 / 1;
      background: #fff;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s ease;
    }
    .card:hover .preview img { transform: scale(1.02); }
    .content { padding: 22px; }
    .type {
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }
    h3 { margin: 0; font-size: 21px; line-height: 1.2; }
    .subtitle {
      margin: 9px 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }
    .meta {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--text);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .button:hover { background: #374151; }
    footer {
      border-top: 1px solid var(--line);
      padding: 25px 0 35px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .container { width: min(100% - 28px, 1120px); }
      header { padding: 48px 0 34px; }
      .grid { grid-template-columns: 1fr; }
      .intro { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="container">
    <div class="eyebrow">Professional Portfolio</div>
    <h1>Certificates</h1>
    <p class="intro">
      A collection of professional certifications, courses, conferences,
      hackathons and learning achievements.
    </p>
  </header>

  <main class="container">
    <div class="section-title">
      <h2>My Certificates</h2>
      <span class="count" id="count"></span>
    </div>
    <section class="grid" id="certificates"></section>
  </main>

  <footer>
    <div class="container">Raul Gomes · Professional Certificates</div>
  </footer>

  <script>
    async function loadCertificates() {
      const response = await fetch("certificates.json");
      const certificates = await response.json();

      document.getElementById("count").textContent =
        `${certificates.length} certificate${certificates.length === 1 ? "" : "s"}`;

      const grid = document.getElementById("certificates");

      certificates.forEach(cert => {
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <a class="preview" href="${cert.image}" target="_blank" rel="noopener">
            <img src="${cert.image}" alt="${cert.title} certificate">
          </a>
          <div class="content">
            <div class="type">${cert.type}</div>
            <h3>${cert.title}</h3>
            <p class="subtitle">${cert.subtitle}</p>
            <div class="meta">
              <span>${cert.issuer}</span>
              <span>${cert.date} · ${cert.duration}</span>
              <span>${cert.location}</span>
            </div>
            <a class="button" href="${cert.image}" target="_blank" rel="noopener">
              View Certificate →
            </a>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    loadCertificates().catch(error => {
      document.getElementById("certificates").innerHTML =
        "<p>Unable to load certificates.</p>";
      console.error(error);
    });
  </script>
</body>
</html>
